<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Jacobabad Insider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/login-pXc_mCEv.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/auth-C3x3DcjY.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-CsvkuiEk.css">
</head>
<body style="background: var(--bg-header); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem;">

  <div style="max-width: 420px; width: 100%; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); overflow: hidden;">
    
    <!-- Card Header -->
    <div style="background: linear-gradient(135deg, var(--bg-header), #1e3a8a); color: white; padding: 2rem; text-align: center;">
      <div class="logo-icon" style="margin: 0 auto 0.75rem auto; width: 50px; height: 50px; font-size: 1.6rem;">JI</div>
      <h1 style="font-family: var(--font-heading); font-size: 1.5rem; color: white;">Jacobabad Insider</h1>
      <p style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.25rem;">Administrator Control Panel</p>
    </div>

    <!-- Login Form -->
    <div style="padding: 2rem;">
      <div style="background: var(--bg-primary); border: 1px solid var(--border-color); padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.25rem; border-left: 4px solid var(--accent-red);">
        <strong style="color: var(--text-main);">Enter Your Credentials:</strong><br/>
      </div>

      <div id="login-error-alert" class="hidden" style="background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; padding: 0.75rem 1rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1rem;"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label">Admin Email Address</label>
          <input type="email" id="login-email" class="form-control" value="Enter your email address" required />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-control" value="Enter your password" required />
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; font-weight: 700;">
          Click to Continue &rarr;
        </button>
      </form>

     <div style="margin-top: 1.25rem; text-align: center;">
  <button id="google-login-btn" class="btn btn-secondary" style="width: 100%; font-size: 0.85rem; padding: 0.6rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color);">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
    Sign In with Google
  </button>
</div>

      <div style="margin-top: 1.25rem; text-align: center; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1rem;">
        <p>Protected System. Access restricted to authorized editorial administrators.</p>
      </div>
    </div>
  </div>

  <div style="margin-top: 1.5rem; text-align: center;">
    <a href="/" style="color: #94a3b8; font-size: 0.85rem;">&larr; Return to Public Website</a>
  </div>

</body>
</html>
